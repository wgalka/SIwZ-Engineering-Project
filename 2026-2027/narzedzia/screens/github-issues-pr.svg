<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Issue i Pull Request</title>
  <desc id="desc">Poglądowy zrzut pokazujący przejście od Issue do brancha i Pull Requesta.</desc>
  <rect width="1200" height="650" fill="#f6f8fa"/>
  <rect width="1200" height="58" fill="#24292f"/>
  <circle cx="32" cy="29" r="15" fill="#ffffff"/>
  <text x="62" y="36" font-family="Arial" font-size="22" fill="#ffffff" font-weight="700">projekt-zespolu / Issues / #12</text>
  <rect x="30" y="88" width="1140" height="160" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="76" cy="132" r="16" fill="#1a7f37"/>
  <text x="112" y="139" font-family="Arial" font-size="25" fill="#24292f" font-weight="700">Dodać wyszukiwanie zasobów</text>
  <text x="112" y="178" font-family="Arial" font-size="17" fill="#57606a">Rezultat: użytkownik otrzymuje listę pasujących rekordów.</text>
  <rect x="112" y="197" width="190" height="28" rx="14" fill="#ddf4ff"/><text x="132" y="217" font-family="Arial" font-size="14" fill="#0969da">kryterium-akceptacji</text>
  <text x="1000" y="139" font-family="Arial" font-size="15" fill="#57606a">przypisano: Jan</text>
  <path d="M180 278 L180 340" stroke="#0969da" stroke-width="5"/><path d="M180 340 L160 318 M180 340 L200 318" fill="none" stroke="#0969da" stroke-width="5"/>
  <rect x="30" y="366" width="340" height="190" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="56" y="407" font-family="Arial" font-size="20" fill="#24292f" font-weight="700">Branch</text>
  <text x="56" y="445" font-family="Consolas, monospace" font-size="16" fill="#24292f">feature/search</text>
  <text x="56" y="486" font-family="Arial" font-size="16" fill="#57606a">commit: add search</text>
  <text x="56" y="520" font-family="Arial" font-size="15" fill="#57606a">zmiana jest mała i opisana</text>
  <path d="M400 460 L492 460" stroke="#0969da" stroke-width="5"/><path d="M492 460 L470 440 M492 460 L470 480" fill="none" stroke="#0969da" stroke-width="5"/>
  <rect x="522" y="366" width="648" height="190" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="550" y="407" font-family="Arial" font-size="20" fill="#24292f" font-weight="700">Pull Request #18</text>
  <text x="550" y="442" font-family="Arial" font-size="17" fill="#24292f">feature/search → main</text>
  <circle cx="555" cy="482" r="10" fill="#1a7f37"/><text x="577" y="488" font-family="Arial" font-size="16" fill="#1a7f37">Checks passed</text>
  <text x="550" y="525" font-family="Arial" font-size="16" fill="#57606a">review → poprawka → merge</text>
</svg>
