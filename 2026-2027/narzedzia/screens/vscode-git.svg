<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">VS Code i Git</title>
  <desc id="desc">Poglądowy zrzut edytora VS Code z plikiem README, kontrolą wersji i terminalem.</desc>
  <rect width="1200" height="650" fill="#1e1e1e"/>
  <rect width="1200" height="42" fill="#333333"/><text x="20" y="28" font-family="Arial" font-size="16" fill="#dddddd">Visual Studio Code · projekt-zespolu</text>
  <rect x="0" y="42" width="62" height="608" fill="#252526"/><text x="22" y="90" font-family="Arial" font-size="24" fill="#cccccc">▤</text><text x="22" y="140" font-family="Arial" font-size="24" fill="#cccccc">⑂</text><text x="22" y="190" font-family="Arial" font-size="24" fill="#cccccc">⌕</text>
  <rect x="62" y="42" width="260" height="360" fill="#252526"/><text x="82" y="78" font-family="Arial" font-size="15" fill="#cccccc">EXPLORER</text>
  <g font-family="Consolas, monospace" font-size="15" fill="#d4d4d4"><text x="84" y="116">▾ projekt-zespolu</text><text x="102" y="151">▸ .github</text><text x="102" y="183">▸ docs</text><text x="102" y="215">▸ src</text><text x="102" y="247">README.md</text><text x="102" y="279">requirements.txt</text></g>
  <rect x="322" y="42" width="878" height="360" fill="#1e1e1e"/><rect x="322" y="42" width="878" height="42" fill="#252526"/><text x="352" y="69" font-family="Arial" font-size="15" fill="#ffffff">README.md</text>
  <g font-family="Consolas, monospace" font-size="17"><text x="360" y="130" fill="#569cd6"># Projekt zespołu</text><text x="360" y="168" fill="#d4d4d4">Opis problemu i sposób uruchomienia.</text><text x="360" y="206" fill="#4ec9b0">## Główny przepływ</text><text x="360" y="244" fill="#dcdcaa">1. Przygotować dane.</text><text x="360" y="278" fill="#dcdcaa">2. Uruchomić analizę.</text><text x="360" y="312" fill="#dcdcaa">3. Odczytać wynik.</text></g>
  <rect x="62" y="402" width="1138" height="248" fill="#181818"/><text x="84" y="434" font-family="Arial" font-size="15" fill="#cccccc">TERMINAL</text><g font-family="Consolas, monospace" font-size="16"><text x="84" y="476" fill="#9cdcfe">PS&gt;</text><text x="120" y="476" fill="#d4d4d4">git status</text><text x="84" y="512" fill="#6a9955">On branch feature/readme</text><text x="84" y="546" fill="#ce9178">modified: README.md</text><text x="84" y="590" fill="#9cdcfe">PS&gt;</text><text x="120" y="590" fill="#d4d4d4">git add README.md &amp;&amp; git commit -m "docs: update README"</text></g>
</svg>
